run:
  shell: powershell
  command: ./run.ps1
  verified_with: "AMD Vivado/XSim 2025.2 seed 1; valid fixture verified three responses, wrong-result fixture failed with UB06_RESPONSE, and learner starter failed with UB06_TODO on 2026-07-28"
completion_evidence:
  - Three requests each receive exactly one correctly routed response.
  - The sequence rejects a response whose payload violates the specified transformation.
  - The test objection remains raised until all responses are validated.
  - The learner explains why request completion and response validation are different events.
