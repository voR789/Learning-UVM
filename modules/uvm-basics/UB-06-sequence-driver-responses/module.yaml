id: UB-06
title: Coordinate sequences, sequencers, drivers, and tests
phase: uvm-basics
kind: micro
status: complete
estimated_minutes: 120
siemens_mapping:
  track: UVM Basics
  unit: Sequences and Tests
prerequisites: [UB-05]
objectives:
