  target_milestone: UA-04
  target_focused_hours: 27
  application_target: Apply UVM to the learner's systolic-array RTL
  coaching_preferences:
    - Pre-complete mature, time-consuming artifacts when they are not the lesson objective.
    - Keep short mechanical UVM repetition such as registration and object instantiation.
    - Provide lean structural skeletons with declarations and empty method signatures.
    - Use broader outcome-based TODOs and reduce proactive implementation guidance.
    - In integration (G-level) modules from UVM Basics onward, include realistic response-driven scenarios: delayed or out-of-order completion where applicable, status/error recovery, and sequence decisions based on observed DUT results. Teach the required response path before assigning it.
    - When a newly created module is converted to a completed read-only checkpoint, create the next eligible substantive module in the same task instead of stopping at the checkpoint.
    - Before assigning any new implementation unit, explicitly compare its objective with recorded evidence and name the genuinely new invariant or transfer decision; otherwise use a reading checkpoint. Do not assign fixture-specific formatting or API transcription as an implementation exercise.
current_focus: UA-02
